<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ETF 믹서기 — 조합 탐색 도구 (MVP)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .disclaimer {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 16px 24px;
      text-align: center;
      font-size: 14px;
      color: #856404;
      font-weight: 600;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      background: white;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 32px;
      text-align: center;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 10px;
      color: #1a1a1a;
    }

    .subtitle {
      font-size: 16px;
      color: #666;
      margin-bottom: 8px;
    }

    .philosophy {
      font-size: 13px;
      color: #888;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
      font-style: italic;
    }

    .badge-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #e9ecef;
      background: #f8f9fa;
      color: #495057;
    }

    .badge.demo {
      background: #fff8e1;
      border-color: #ffe082;
      color: #7a5a00;
    }

    .step-section {
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .step-header {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
    }

    .step-number {
      width: 40px;
      height: 40px;
      background: #0d6efd;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      margin-right: 16px;
    }

    .step-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .asset-groups {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 20px;
    }

    .asset-group {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }

    .asset-group:hover { border-color: #0d6efd; }

    .asset-group-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #495057;
      padding-bottom: 12px;
      border-bottom: 2px solid #e9ecef;
    }

    .etf-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
      border: 1px solid transparent;
    }

    .etf-item:hover { background: #f8f9fa; }

    .etf-item.selected {
      background: #e7f1ff;
      border-color: #0d6efd;
    }

    .etf-checkbox {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #0d6efd;
    }

    .etf-info { flex: 1; }

    .etf-name {
      font-size: 14px;
      font-weight: 600;
      color: #212529;
      margin-bottom: 2px;
    }

    .etf-desc {
      font-size: 12px;
      color: #6c757d;
    }

    .selection-summary {
      background: #f8f9fa;
      padding: 16px 20px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
      color: #495057;
    }

    .summary-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      justify-content: space-between;
    }

    .rule-status {
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e9ecef;
      color: #495057;
      white-space: nowrap;
    }

    .rule-status.ok {
      background: #d1e7dd;
      color: #0f5132;
    }

    .rule-status.bad {
      background: #f8d7da;
      color: #842029;
    }

    .view-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    .view-card {
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .view-card:hover {
      border-color: #0d6efd;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13,110,253,0.2);
    }

    .view-card.selected {
      border-color: #0d6efd;
      background: #e7f1ff;
    }

    .view-icon {
      font-size: 36px;
      margin-bottom: 12px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    .view-desc {
      font-size: 13px;
      color: #6c757d;
      line-height: 1.5;
    }

    .calculate-btn {
      width: 100%;
      padding: 18px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(13,110,253,0.3);
    }

    .calculate-btn:hover:not(:disabled) {
      background: #0b5ed7;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(13,110,253,0.4);
    }

    .calculate-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
      opacity: 0.6;
      box-shadow: none;
    }

    .helper-text {
      margin-top: 10px;
      font-size: 13px;
      color: #6c757d;
      text-align: center;
    }

    .result-section { display: none; }
    .result-section.visible { display: block; }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .metric-label {
      font-size: 12px;
      color: #6c757d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 900;
      color: #1a1a1a;
    }

    .allocation-section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      margin-bottom: 24px;
    }

    .allocation-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #495057;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .allocation-title .sub {
      font-size: 12px;
      color: #6c757d;
      font-weight: 700;
    }

    .allocation-item { margin-bottom: 16px; }

    .allocation-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .allocation-name {
      font-weight: 700;
      color: #212529;
    }

    .allocation-percent {
      font-weight: 900;
      color: #0d6efd;
    }

    .allocation-bar {
      height: 12px;
      background: #e9ecef;
      border-radius: 6px;
      overflow: hidden;
    }

    .allocation-fill {
      height: 100%;
      background: linear-gradient(90deg, #0d6efd, #0dcaf0);
      border-radius: 6px;
      transition: width 0.5s ease;
    }

    .explanation {
      background: #fff8e1;
      border-left: 4px solid #ffc107;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .explanation-title {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 12px;
      color: #7a5a00;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .explanation-text {
      font-size: 14px;
      color: #856404;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .mv-toggle {
      text-align: center;
      margin-bottom: 16px;
    }

    .toggle-btn {
      background: white;
      border: 2px solid #0d6efd;
      color: #0d6efd;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn:hover {
      background: #0d6efd;
      color: white;
    }

    .mv-chart-container {
      display: none;
      background: white;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
      margin-bottom: 24px;
    }

    .mv-chart-container.visible { display: block; }

    .chart-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #495057;
      text-align: center;
    }

    .reset-btn {
      width: 100%;
      padding: 14px;
      background: white;
      color: #6c757d;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: #6c757d;
      color: #495057;
    }

    @media (max-width: 768px) {
      .asset-groups, .view-options, .result-grid { grid-template-columns: 1fr; }
      header { padding: 32px 20px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>

<body>
  <div class="disclaimer" id="topDisclaimer"></div>

  <div class="container">
    <header>
      <h1>ETF 믹서기</h1>
      <p class="subtitle">ETF를 섞어보며 “조합”과 “관점”이 MV 공간에서 위치를 어떻게 바꾸는지 보는 도구</p>
      <p class="philosophy" id="philosophyCopy"></p>

      <div class="badge-row">
        <span class="badge demo" id="demoBadge"></span>
        <span class="badge" id="ruleBadge"></span>
      </div>
    </header>

    <!-- Step 1: ETF 선택 -->
    <div class="step-section">
      <div class="step-header">
        <div class="step-number">1</div>
        <div class="step-title">재료(ETF) 선택</div>
      </div>

      <div class="asset-groups">
        <div class="asset-group">
          <div class="asset-group-title">📈 주식</div>
          <div class="etf-list" data-group="stock"></div>
        </div>

        <div class="asset-group">
          <div class="asset-group-title">🏦 채권</div>
          <div class="etf-list" data-group="bond"></div>
        </div>

        <div class="asset-group">
          <div class="asset-group-title">🏢 대체자산</div>
          <div class="etf-list" data-group="alternative"></div>
        </div>
      </div>

      <div class="selection-summary">
        <div class="summary-row">
          <div>
            선택된 ETF: <strong><span id="selectedCount">0</span>개</strong>
            · 자산군: <strong><span id="selectedGroupsCount">0</span>개</strong>
          </div>
          <div class="rule-status bad" id="ruleStatusPill">규칙 미충족</div>
        </div>

        <div style="margin-top: 10px; font-size: 13px; color: #6c757d;">
          <span id="ruleCopy"></span>
        </div>
      </div>
    </div>

    <!-- Step 2: 관점 선택 -->
    <div class="step-section">
      <div class="step-header">
        <div class="step-number">2</div>
        <div class="step-title">계산 관점 선택</div>
      </div>

      <div class="view-options" id="viewOptions"></div>
    </div>

    <!-- Step 3: 계산 -->
    <div class="step-section">
      <button class="calculate-btn" id="calculateBtn" disabled>조합 위치 보기</button>
      <div class="helper-text" id="calculateHelper"></div>
    </div>

    <!-- Step 4: 결과 -->
    <div class="result-section" id="resultSection">
      <div class="step-section">
        <div class="step-header">
          <div class="step-number">4</div>
          <div class="step-title">결과(데모)</div>
        </div>

        <div class="result-grid">
          <div class="metric-card">
            <div class="metric-label">예상 수익률 (DEMO)</div>
            <div class="metric-value" id="returnValue">-</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">변동성 (DEMO)</div>
            <div class="metric-value" id="volatilityValue">-</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">선택 관점</div>
            <div class="metric-value" id="viewValue" style="font-size: 20px;">-</div>
          </div>
        </div>

        <div class="allocation-section">
          <div class="allocation-title">
            <div>📊 자동 계산된 비율 (DEMO)</div>
            <div class="sub">현재는 임시 로직이며, 백엔드 연결 시 교체됩니다.</div>
          </div>
          <div id="allocationList"></div>
        </div>

        <div class="explanation">
          <div class="explanation-title">
            <span>💡 왜 이 위치에 있나요?</span>
            <span class="badge demo">DEMO</span>
          </div>
          <div id="explanationText"></div>
        </div>

        <div class="mv-toggle">
          <button class="toggle-btn" id="toggleMV" aria-expanded="false">MV 평면 보기</button>
        </div>

        <div class="mv-chart-container" id="mvChartContainer">
          <div class="chart-title">변동성–수익률 평면 (Mean–Variance) · DEMO</div>
          <canvas id="mvChart" height="300"></canvas>
        </div>

        <button class="reset-btn" id="resetBtn">다시 조합하기</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      copy: {
        disclaimer:
          "이 도구는 투자 추천이 아닙니다. ETF 조합이 결과 위치를 어떻게 바꾸는지 ‘탐색’하기 위한 사고 도구입니다.",
        philosophy:
          "“정답”이나 “최적”을 제시하지 않습니다. 조합과 관점이 결과를 어떻게 바꾸는지 보여줄 뿐입니다.",
        demoBadge: "DEMO: 현재 계산은 임시(백엔드 미연결)",
        ruleBadgePrefix: "선택 규칙:",
        ruleCopy:
          "총 3–5개 ETF를 고르고, 최소 2개 자산군(주식/채권/대체자산)을 포함하세요. 비율은 시스템이 자동으로 계산합니다(수동 조절 없음).",
        calculateHelperBase: "규칙을 만족하고 관점을 고르면 버튼이 활성화됩니다.",
        calculateHelperMissingView: "관점을 선택하세요.",
        calculateHelperRuleNotMet: "ETF 선택 규칙을 만족하세요.",
        alerts: {
          maxEtfs: (max) => `최대 ${max}개까지만 선택할 수 있어요.`,
        },
        assetLabels: {
          stock: "주식",
          bond: "채권",
          alternative: "대체자산",
        },
        viewNames: {
          stable: "안정 중심",
          balanced: "균형 중심",
          growth: "성장 중심",
        },
        viewCards: [
          {
            id: "stable",
            icon: "🛡",
            name: "안정 중심",
            desc: "흔들림(변동성)을 줄이는 쪽으로 조합을 잡아보는 관점",
          },
          {
            id: "balanced",
            icon: "⚖",
            name: "균형 중심",
            desc: "변동성과 기대수익의 균형점을 상상해보는 관점",
          },
          {
            id: "growth",
            icon: "🚀",
            name: "성장 중심",
            desc: "장기 성장 가능성을 더 크게 보는 관점(흔들림을 감수할 수 있음)",
          },
        ],
      },
      constraints: {
        minEtfs: 3,
        maxEtfs: 5,
        minAssetClasses: 2,
      },
      data: {
        etfs: {
          stock: [
            { id: "stock1", name: "KODEX 200", desc: "국내 대표 주식", demoReturn: 0.08, demoVol: 0.15 },
            { id: "stock2", name: "TIGER 미국S&P500", desc: "미국 대형주", demoReturn: 0.10, demoVol: 0.18 },
            { id: "stock3", name: "KODEX 나스닥100", desc: "미국 기술주", demoReturn: 0.12, demoVol: 0.22 },
          ],
          bond: [
            { id: "bond1", name: "KODEX 국고채10년", desc: "장기 국채", demoReturn: 0.04, demoVol: 0.05 },
            { id: "bond2", name: "TIGER 단기채권", desc: "단기 안정 채권", demoReturn: 0.03, demoVol: 0.03 },
            { id: "bond3", name: "ACE 회사채", desc: "회사채 혼합", demoReturn: 0.05, demoVol: 0.07 },
          ],
          alternative: [
            { id: "alt1", name: "KODEX 리츠", desc: "부동산 간접투자", demoReturn: 0.06, demoVol: 0.12 },
            { id: "alt2", name: "TIGER 금", desc: "금 현물", demoReturn: 0.05, demoVol: 0.14 },
            { id: "alt3", name: "KODEX 원유선물", desc: "원자재", demoReturn: 0.07, demoVol: 0.25 },
          ],
        },
      },
    };

    const state = {
      selected: new Map(),
      selectedView: null,
      mvChart: null,
      lastResult: null,
      mvVisible: false,
    };

    function qs(sel) { return document.querySelector(sel); }
    function qsa(sel) { return Array.from(document.querySelectorAll(sel)); }
    function setText(sel, text) { qs(sel).textContent = text; }
    function setHtml(sel, html) { qs(sel).innerHTML = html; }

    function init() {
      setText("#topDisclaimer", CONFIG.copy.disclaimer);
      setText("#philosophyCopy", CONFIG.copy.philosophy);
      setText("#demoBadge", CONFIG.copy.demoBadge);
      setText("#ruleBadge", `${CONFIG.copy.ruleBadgePrefix} ${ruleSummaryText()}`);
      setText("#ruleCopy", CONFIG.copy.ruleCopy);
      setText("#calculateHelper", CONFIG.copy.calculateHelperBase);

      renderEtfLists();
      renderViewCards();
      wireHandlers();
      renderAll();
    }

    function ruleSummaryText() {
      const c = CONFIG.constraints;
      return `총 ${c.minEtfs}–${c.maxEtfs}개 + 최소 ${c.minAssetClasses}개 자산군`;
    }

    function renderEtfLists() {
      Object.keys(CONFIG.data.etfs).forEach((group) => {
        const container = qs(`[data-group="${group}"]`);
        container.innerHTML = "";

        CONFIG.data.etfs[group].forEach((etf) => {
          const item = document.createElement("div");
          item.className = "etf-item";
          item.dataset.etfId = etf.id;

          item.innerHTML = `
            <input type="checkbox" class="etf-checkbox" data-id="${etf.id}" data-group="${group}" aria-label="${escapeHtml(etf.name)} 선택">
            <div class="etf-info">
              <div class="etf-name">${escapeHtml(etf.name)}</div>
              <div class="etf-desc">${escapeHtml(etf.desc)}</div>
            </div>
          `;

          const checkbox = item.querySelector(".etf-checkbox");

          item.addEventListener("click", (e) => {
            if (e.target && e.target.classList && e.target.classList.contains("etf-checkbox")) return;
            checkbox.checked = !checkbox.checked;
            checkbox.dispatchEvent(new Event("change", { bubbles: true }));
          });

          checkbox.addEventListener("change", (e) => onEtfCheckboxChange(e.target));
          container.appendChild(item);
        });
      });
    }

    function renderViewCards() {
      const container = qs("#viewOptions");
      container.innerHTML = "";

      CONFIG.copy.viewCards.forEach((view) => {
        const card = document.createElement("div");
        card.className = "view-card";
        card.dataset.view = view.id;

        card.innerHTML = `
          <div class="view-icon">${escapeHtml(view.icon)}</div>
          <div class="view-name">${escapeHtml(view.name)}</div>
          <div class="view-desc">${escapeHtml(view.desc)}</div>
        `;

        card.addEventListener("click", () => selectView(view.id));
        container.appendChild(card);
      });
    }

    function wireHandlers() {
      qs("#calculateBtn").addEventListener("click", onCalculate);
      qs("#resetBtn").addEventListener("click", onReset);
      qs("#toggleMV").addEventListener("click", onToggleMv);
    }

    function onEtfCheckboxChange(checkbox) {
      const etfId = checkbox.dataset.id;
      const group = checkbox.dataset.group;

      if (checkbox.checked) {
        const nextCount = state.selected.size + 1;
        if (nextCount > CONFIG.constraints.maxEtfs) {
          checkbox.checked = false;
          alert(CONFIG.copy.alerts.maxEtfs(CONFIG.constraints.maxEtfs));
          return;
        }
        state.selected.set(etfId, { id: etfId, group });
      } else {
        state.selected.delete(etfId);
      }

      checkbox.closest(".etf-item").classList.toggle("selected", checkbox.checked);

      if (!isSelectionValid() || !state.selectedView) hideResults();
      renderAll();
    }

    function selectView(viewId) {
      state.selectedView = viewId;
      qsa(".view-card").forEach((c) => c.classList.toggle("selected", c.dataset.view === viewId));

      if (!isSelectionValid()) hideResults();
      renderAll();
    }

    function getSelectedGroupsCount() {
      const groups = new Set(Array.from(state.selected.values()).map((s) => s.group));
      return groups.size;
    }

    function isSelectionValid() {
      const count = state.selected.size;
      const groupsCount = getSelectedGroupsCount();
      const c = CONFIG.constraints;

      if (count < c.minEtfs) return false;
      if (count > c.maxEtfs) return false;
      if (groupsCount < c.minAssetClasses) return false;

      return true;
    }

    function isReadyToCalculate() {
      return isSelectionValid() && !!state.selectedView;
    }

    function renderAll() {
      renderSelectionSummary();
      renderCalculateState();
    }

    function renderSelectionSummary() {
      setText("#selectedCount", String(state.selected.size));
      setText("#selectedGroupsCount", String(getSelectedGroupsCount()));

      const pill = qs("#ruleStatusPill");
      const ok = isSelectionValid();

      pill.classList.toggle("ok", ok);
      pill.classList.toggle("bad", !ok);
      pill.textContent = ok ? "규칙 충족" : "규칙 미충족";
    }

    function renderCalculateState() {
      const btn = qs("#calculateBtn");
      btn.disabled = !isReadyToCalculate();

      const helper = qs("#calculateHelper");
      if (!isSelectionValid()) {
        helper.textContent = CONFIG.copy.calculateHelperRuleNotMet;
        return;
      }
      if (!state.selectedView) {
        helper.textContent = CONFIG.copy.calculateHelperMissingView;
        return;
      }
      helper.textContent = CONFIG.copy.calculateHelperBase;
    }

    function onCalculate() {
      if (!isReadyToCalculate()) return;

      const selectedEtfs = getSelectedEtfObjects();
      const weights = computeDemoWeights(selectedEtfs, state.selectedView);
      const { portReturn, portVol } = computeDemoPortfolioPoint(selectedEtfs, weights);

      state.lastResult = { etfs: selectedEtfs, weights, portReturn, portVol };
      state.mvVisible = false;
      setMvVisible(false);
      renderResults(state.lastResult);
      showResults();
    }

    function getSelectedEtfObjects() {
      return Array.from(state.selected.values()).map((s) => {
        const list = CONFIG.data.etfs[s.group] || [];
        const etf = list.find((e) => e.id === s.id);
        return {
          id: etf.id,
          name: etf.name,
          desc: etf.desc,
          group: s.group,
          demoReturn: etf.demoReturn,
          demoVol: etf.demoVol,
        };
      });
    }

    function computeDemoWeights(etfs, viewId) {
      // DEMO ONLY: placeholder logic until backend is connected.
      if (etfs.length === 0) return [];

      if (viewId === "balanced") {
        return etfs.map(() => 1 / etfs.length);
      }

      if (viewId === "stable") {
        const inv = etfs.map((e) => 1 / Math.max(1e-6, e.demoVol));
        const sum = inv.reduce((a, b) => a + b, 0);
        return inv.map((v) => v / sum);
      }

      // growth (DEMO): weight proportional to demoReturn, with a soft cap.
      const raw = etfs.map((e) => Math.max(0.0001, e.demoReturn));
      const sumRaw = raw.reduce((a, b) => a + b, 0);
      let w = raw.map((v) => v / sumRaw);

      const cap = 0.6;
      w = w.map((x) => Math.min(cap, x));
      const sumW = w.reduce((a, b) => a + b, 0);
      return w.map((x) => x / sumW);
    }

    function computeDemoPortfolioPoint(etfs, weights) {
      // DEMO ONLY: simplified combination with a mild diversification effect.
      const portReturn = etfs.reduce((sum, e, i) => sum + e.demoReturn * weights[i], 0);
      const baseVar = etfs.reduce((sum, e, i) => sum + Math.pow(e.demoVol * weights[i], 2), 0);
      const diversificationFactor = 0.85;
      const portVol = Math.sqrt(baseVar) * diversificationFactor;
      return { portReturn, portVol };
    }

    function renderResults(result) {
      const viewName = CONFIG.copy.viewNames[state.selectedView] || "-";
      setText("#returnValue", `${(result.portReturn * 100).toFixed(1)}%`);
      setText("#volatilityValue", `${(result.portVol * 100).toFixed(1)}%`);
      setText("#viewValue", viewName);

      setHtml("#allocationList", renderAllocationHtml(result.etfs, result.weights));
      setHtml("#explanationText", renderExplanationHtml(result));

      destroyChart();
      setToggleLabel(false);
    }

    function renderAllocationHtml(etfs, weights) {
      return etfs.map((etf, i) => {
        const pct = weights[i] * 100;
        return `
          <div class="allocation-item">
            <div class="allocation-header">
              <span class="allocation-name">${escapeHtml(etf.name)}</span>
              <span class="allocation-percent">${pct.toFixed(1)}%</span>
            </div>
            <div class="allocation-bar">
              <div class="allocation-fill" style="width: ${pct.toFixed(2)}%"></div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderExplanationHtml(result) {
      const groups = groupCounts(result.etfs);
      const groupText = Object.entries(groups)
        .map(([g, n]) => `${CONFIG.copy.assetLabels[g] || g} ${n}개`)
        .join(" · ");

      const avgVol = result.etfs.reduce((sum, e) => sum + e.demoVol, 0) / Math.max(1, result.etfs.length);
      const reduction = avgVol > 0 ? ((avgVol - result.portVol) / avgVol) : 0;
      const reductionPct = (reduction * 100).toFixed(0);

      const viewName = CONFIG.copy.viewNames[state.selectedView] || "선택 관점";

      const lines = [
        `현재 결과는 <strong>DEMO(임시 계산)</strong>입니다. 실제 데이터/백엔드 연결 전까지는 “정확한 수치”가 아니라 “구조 이해”용입니다.`,
        `선택 구성: <strong>${escapeHtml(groupText)}</strong> · 총 <strong>${result.etfs.length}개 ETF</strong>`,
        `${escapeHtml(viewName)} 관점에서 시스템이 <strong>자동으로 비율</strong>을 잡았습니다(수동 조절 없음).`,
        `개별 평균 변동성 대비 포트폴리오 변동성은 <strong>약 ${escapeHtml(reductionPct)}% 낮아진</strong> 것으로 표시됩니다(분산효과를 단순 반영한 DEMO).`,
        `이 도구는 “추천/정답”을 말하지 않고, <strong>조합을 바꿀 때 위치가 어떻게 이동하는지</strong>를 보여줍니다.`,
      ];

      return lines.map((t) => `<div class="explanation-text">${t}</div>`).join("");
    }

    function groupCounts(etfs) {
      const counts = {};
      etfs.forEach((e) => { counts[e.group] = (counts[e.group] || 0) + 1; });
      return counts;
    }

    function showResults() {
      qs("#resultSection").classList.add("visible");
      qs("#resultSection").scrollIntoView({ behavior: "smooth" });
    }

    function hideResults() {
      qs("#resultSection").classList.remove("visible");
      state.lastResult = null;
      state.mvVisible = false;
      setMvVisible(false);
      destroyChart();
      setToggleLabel(false);
    }

    function onReset() {
      state.selected.clear();
      state.selectedView = null;

      qsa(".etf-checkbox").forEach((cb) => { cb.checked = false; });
      qsa(".etf-item").forEach((item) => item.classList.remove("selected"));
      qsa(".view-card").forEach((c) => c.classList.remove("selected"));

      hideResults();
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function onToggleMv() {
      if (!state.lastResult) return;

      state.mvVisible = !state.mvVisible;
      setMvVisible(state.mvVisible);
      setToggleLabel(state.mvVisible);

      if (state.mvVisible) renderMvChart(state.lastResult);
    }

    function setMvVisible(visible) {
      qs("#mvChartContainer").classList.toggle("visible", visible);
      qs("#toggleMV").setAttribute("aria-expanded", visible ? "true" : "false");
    }

    function setToggleLabel(visible) {
      qs("#toggleMV").textContent = visible ? "MV 평면 숨기기" : "MV 평면 보기";
    }

    function renderMvChart(result) {
      const ctx = qs("#mvChart").getContext("2d");
      destroyChart();

      const etfPoints = result.etfs.map((e) => ({ x: e.demoVol * 100, y: e.demoReturn * 100 }));
      const portfolioPoint = { x: result.portVol * 100, y: result.portReturn * 100 };

      state.mvChart = new Chart(ctx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "개별 ETF (DEMO)",
              data: etfPoints,
              backgroundColor: "rgba(108, 117, 125, 0.6)",
              borderColor: "rgba(108, 117, 125, 1)",
              pointRadius: 6,
            },
            {
              label: "조합 결과 위치 (DEMO)",
              data: [portfolioPoint],
              backgroundColor: "rgba(13, 110, 253, 0.85)",
              borderColor: "rgba(13, 110, 253, 1)",
              pointRadius: 12,
              pointStyle: "star",
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                label: function (context) {
                  return `변동성: ${context.parsed.x.toFixed(1)}%, 수익률: ${context.parsed.y.toFixed(1)}% (DEMO)`;
                },
              },
            },
          },
          scales: {
            x: {
              title: { display: true, text: "변동성 (%)" },
              grid: { color: "rgba(0,0,0,0.06)" },
            },
            y: {
              title: { display: true, text: "예상 수익률 (%)" },
              grid: { color: "rgba(0,0,0,0.06)" },
            },
          },
        },
      });
    }

    function destroyChart() {
      if (state.mvChart) {
        state.mvChart.destroy();
        state.mvChart = null;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    init();
  </script>
</body>
</html>
